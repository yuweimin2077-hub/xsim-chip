name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  unit-tests:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install analysis, simulation, and test dependencies
        run: python -m pip install -e ".[dev,simulation]"
      - name: Run tests
        run: pytest --cov=xsim_chip_analysis --cov-report=term-missing --cov-fail-under=85
